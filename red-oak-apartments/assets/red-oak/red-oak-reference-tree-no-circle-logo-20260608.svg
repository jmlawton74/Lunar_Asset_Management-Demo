<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Red Oak Apartment Homes logo</title>
  <desc id="desc">A standalone Red Oak Apartment Homes logo with the reference oak tree silhouette, RED OAK wordmark, and Apartment Homes spelled correctly, without an enclosing circle.</desc>
  <rect width="720" height="540" rx="28" fill="#F9F7F2"/>
  <image x="247" y="73" width="226" height="214" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  <text x="360" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="700" letter-spacing="2" fill="#62302D">RED OAK</text>
  <line x1="92" y1="466" x2="144" y2="466" stroke="#2B2B29" stroke-width="8" stroke-linecap="square"/>
  <line x1="576" y1="466" x2="628" y2="466" stroke="#2B2B29" stroke-width="8" stroke-linecap="square"/>
  <text x="360" y="482" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#2B2B29">Apartment Homes</text>
</svg>
