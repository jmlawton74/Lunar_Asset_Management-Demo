<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Red Oak Apartment Homes logo</title>
  <desc id="desc">A circular Red Oak Apartment Homes decal-style logo with the reference oak tree silhouette, RED OAK wordmark, Apartment Homes spelled correctly, and phone number 804.329.6249.</desc>
  <defs>
    <clipPath id="circleClip">
      <circle cx="360" cy="360" r="332"/>
    </clipPath>
  </defs>
  <rect width="720" height="720" fill="none"/>
  <g clip-path="url(#circleClip)">
    <circle cx="360" cy="360" r="332" fill="#F9F7F2"/>
    <rect x="0" y="548" width="720" height="220" fill="#78101E"/>
  </g>
  <circle cx="360" cy="360" r="332" fill="none" stroke="#78101E" stroke-width="14"/>
  <image x="247" y="73" width="226" height="214" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  <text x="360" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="700" letter-spacing="2" fill="#78101E">RED OAK</text>
  <line x1="92" y1="466" x2="144" y2="466" stroke="#2B2B29" stroke-width="8" stroke-linecap="square"/>
  <line x1="576" y1="466" x2="628" y2="466" stroke="#2B2B29" stroke-width="8" stroke-linecap="square"/>
  <text x="360" y="482" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#2B2B29">Apartment Homes</text>
  <text x="360" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="5" fill="#FFFFFF">804.329.6249</text>
</svg>
