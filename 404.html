<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting | Lunar Asset Management</title>
  <script>
    (function () {
      var repoBase = "/Lunar_Asset_Management-Demo/";
      var repoBaseLower = repoBase.toLowerCase();
      var path = window.location.pathname;
      var lower = path.toLowerCase();
      var redOakPaths = [
        repoBaseLower + "red-oak-apartments",
        repoBaseLower + "red-oak-apartments/"
      ];

      if (redOakPaths.indexOf(lower) !== -1) {
        window.location.replace("https://jmlawton74.github.io/Lunar_Asset_Management-Demo/red-oak-apartments/" + window.location.search + window.location.hash);
      }
    })();
  </script>

    }
